# ══════════════════════════════════════════════════════════════════
#  OpsRunbook RAG — docker-compose
#  Services: app (FastAPI+React), db (PostgreSQL)
# ══════════════════════════════════════════════════════════════════
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: opsrunbook_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
      POSTGRES_DB: postgres          # base DB; app creates auth + app DBs automatically
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: opsrunbook_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-opsrunbook_auth}
      APP_DB_NAME:  ${APP_DB_NAME:-opsrunbook_app}
    volumes:
      - faiss_data:/app/faiss_data

volumes:
  postgres_data:
  faiss_data:
